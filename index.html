<style>
:root{--p:#2563eb;--s:#7c3aed;--a:#06b6d4;--bg:#f8fafc;--bg2:#eef2f8;--card:rgba(255,255,255,.86);--card2:#fff;--tx:#0f172a;--mut:#64748b;--line:rgba(15,23,42,.09);--glass:rgba(255,255,255,.78);--sh:0 14px 40px -18px rgba(15,23,42,.28);--r:24px;--font:'Cairo','Tajawal',Arial,sans-serif;--ease:cubic-bezier(.2,.8,.2,1);color-scheme:light}

:focus-visible{outline:3px solid rgba(59,130,246,.65);outline-offset:3px;border-radius:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ===== loader ===== */
#loader{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:#020617;color:#e2e8f0;overflow:hidden;transition:opacity .7s ease,transform .8s var(--ease),visibility .8s}
#loader.done{opacity:0;visibility:hidden;transform:scale(1.06);pointer-events:none}
.ld-bg{position:absolute;inset:0;background:radial-gradient(60% 50% at 50% 38%,rgba(37,99,235,.28),transparent 70%),radial-gradient(40% 40% at 85% 85%,rgba(124,58,237,.22),transparent 70%),radial-gradient(40% 40% at 10% 90%,rgba(6,182,212,.18),transparent 70%)}
.ld-grid{position:absolute;inset:-20%;background-image:linear-gradient(rgba(148,163,184,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,184,.07) 1px,transparent 1px);background-size:44px 44px;transform:perspective(600px) rotateX(58deg) translateY(-8%);mask-image:radial-gradient(closest-side,#000 30%,transparent 100%);-webkit-mask-image:radial-gradient(closest-side,#000 30%,transparent 100%);animation:gridMove 6s linear infinite}
@keyframes gridMove{to{background-position:0 44px}}
.ld-card{position:relative;display:flex;flex-direction:column;align-items:center;gap:18px;padding:24px;text-align:center}
.ld-photo{position:relative;width:min(58vw,230px);aspect-ratio:1;display:grid;place-items:center}
.ld-photo .aura{position:absolute;inset:-14%;border-radius:50%;background:conic-gradient(from 0deg,#2563eb,#7c3aed,#06b6d4,#2563eb);filter:blur(22px);opacity:.55;animation:spin 5s linear infinite}
.ld-photo .ring{position:absolute;inset:-7%;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 25%,#06b6d4 55%,#7c3aed 80%,#2563eb);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));animation:spin 1.6s linear infinite}
.ld-photo .dash{position:absolute;inset:-17%;border-radius:50%;border:1.5px dashed rgba(148,163,184,.4);animation:spin 14s linear infinite reverse}
.ld-photo .orb{position:absolute;inset:-17%;animation:spin 3.2s linear infinite}
.ld-photo .orb i{position:absolute;top:-5px;left:50%;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:#22d3ee;box-shadow:0 0 14px 3px rgba(34,211,238,.8)}
.ld-photo .orb.o2{animation-duration:5s;animation-direction:reverse;inset:-26%}
.ld-photo .orb.o2 i{background:#a78bfa;box-shadow:0 0 14px 3px rgba(167,139,250,.8);width:8px;height:8px}
.ld-frame{position:relative;width:100%;height:100%;border-radius:50%;overflow:hidden;border:3px solid rgba(255,255,255,.9);box-shadow:0 20px 50px -10px rgba(0,0,0,.6);background:#0f172a;animation:pulse 2.4s ease-in-out infinite}
.ld-frame img{width:100%;height:100%;object-fit:cover;object-position:center top}
.ld-handles{position:absolute;inset:-10%;pointer-events:none;border:1px solid rgba(96,165,250,.45);animation:handles 3.2s ease-in-out infinite}
.ld-handles b{position:absolute;width:9px;height:9px;background:#020617;border:1.5px solid #60a5fa}
.ld-handles b:nth-child(1){top:-5px;left:-5px}.ld-handles b:nth-child(2){top:-5px;right:-5px}.ld-handles b:nth-child(3){bottom:-5px;left:-5px}.ld-handles b:nth-child(4){bottom:-5px;right:-5px}
@keyframes handles{0%,100%{opacity:.25;transform:scale(.96)}50%{opacity:.9;transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(1.025)}}
.ld-name{font-size:clamp(1.7rem,6vw,2.6rem);font-weight:900;line-height:1.3;background:linear-gradient(100deg,#fff 20%,#93c5fd 45%,#c4b5fd 60%,#fff 80%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:nameIn 1s var(--ease) both,shine 3.2s linear infinite}
.ld-role{font-size:.95rem;font-weight:700;color:#94a3b8;animation:nameIn 1s .25s var(--ease) both}
@keyframes nameIn{from{opacity:0;transform:translateY(14px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes shine{to{background-position:-250% 0}}
.ld-bar{width:min(60vw,240px);height:4px;border-radius:9px;background:rgba(148,163,184,.2);overflow:hidden;animation:nameIn 1s .4s var(--ease) both}
.ld-bar i{display:block;height:100%;width:var(--lp,8%);border-radius:inherit;background:linear-gradient(90deg,#2563eb,#7c3aed,#06b6d4);transition:width .5s var(--ease)}
.ld-dots{display:flex;gap:6px;height:8px}.ld-dots i{width:6px;height:6px;border-radius:50%;background:#60a5fa;animation:dot 1s ease-in-out infinite}.ld-dots i:nth-child(2){animation-delay:.15s}.ld-dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}

/* ===== background fx ===== */
.bgfx{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;background:radial-gradient(520px 520px at 0% 0%,rgba(59,130,246,.10),transparent 70%),radial-gradient(520px 520px at 100% 34%,rgba(168,85,247,.09),transparent 70%),radial-gradient(520px 520px at 33% 100%,rgba(6,182,212,.09),transparent 70%)}
.bgfx span{position:absolute;border:1px solid rgba(37,99,235,.14);border-radius:30%;animation:floatShape 18s ease-in-out infinite;will-change:transform}

.bgfx span:nth-child(1){width:180px;height:180px;left:7%;top:12%}.bgfx span:nth-child(2){width:120px;height:120px;right:12%;top:28%;animation-delay:-5s}.bgfx span:nth-child(3){width:220px;height:220px;right:2%;bottom:4%;animation-delay:-9s}.bgfx span:nth-child(4){width:90px;height:90px;left:35%;bottom:10%;animation-delay:-12s}
@keyframes floatShape{0%,100%{transform:translateY(0) rotate(0);opacity:.4}50%{transform:translateY(-26px) rotate(28deg);opacity:.85}}
.no-shapes .bgfx span{display:none}

/* ===== ticker ===== */
.ticker{position:relative;background:linear-gradient(90deg,#0b1224,#111c38,#0b1224);color:#e2e8f0;font-size:.8rem;font-weight:700;overflow:hidden;white-space:nowrap;height:34px;display:flex;align-items:center;border-bottom:1px solid rgba(148,163,184,.12)}
.ticker::before,.ticker::after{content:'';position:absolute;top:0;bottom:0;width:60px;z-index:2;pointer-events:none}
.ticker::before{inset-inline-start:0;background:linear-gradient(90deg,#0b1224,transparent)}.ticker::after{inset-inline-end:0;background:linear-gradient(270deg,#0b1224,transparent)}
[dir=rtl] .ticker::before{background:linear-gradient(270deg,#0b1224,transparent)}[dir=rtl] .ticker::after{background:linear-gradient(90deg,#0b1224,transparent)}
.tk-track{display:inline-flex;align-items:center;flex:none;animation:tk 32s linear infinite;will-change:transform}
.ticker:hover .tk-track{animation-play-state:paused}
.tk-track span{display:inline-flex;align-items:center;gap:14px;padding-inline:22px}
.tk-track span::after{content:'';width:6px;height:6px;border-radius:50%;background:linear-gradient(135deg,var(--p),var(--a))}
@keyframes tk{from{transform:translateX(0)}to{transform:translateX(-100%)}}
[dir=rtl] .tk-track{animation-name:tkr}@keyframes tkr{from{transform:translateX(0)}to{transform:translateX(100%)}}
.no-ticker .ticker{display:none}

/* ===== header (floating pill) ===== */
.hdr{position:sticky;top:0;z-index:60;padding:10px 12px 0;pointer-events:none}
.hdr-in{pointer-events:auto;position:relative;margin:0 auto;max-width:1120px;height:62px;display:flex;align-items:center;gap:10px;padding:7px 8px;padding-inline-start:9px;border-radius:999px;background:var(--glass);border:1px solid var(--line);box-shadow:0 8px 30px -14px rgba(2,6,23,.45);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);transition:max-width .45s var(--ease),height .35s var(--ease),box-shadow .3s,background .3s}
.hdr.sc .hdr-in{max-width:980px;height:56px;box-shadow:0 14px 40px -14px rgba(2,6,23,.6)}
.hdr-prog{position:absolute;inset-inline:22px;bottom:-1px;height:2px;border-radius:2px;overflow:hidden;pointer-events:none}
.hdr-prog i{display:block;height:100%;width:100%;transform-origin:var(--po,right);transform:scaleX(var(--sp,0));background:linear-gradient(90deg,var(--p),var(--s),var(--a))}
[dir=ltr] .hdr-prog i{--po:left}
.logo{flex:none;display:block;width:44px;height:44px;border-radius:50%;padding:2px;background:linear-gradient(135deg,var(--p),var(--s),var(--a));box-shadow:0 6px 18px -6px var(--p);transition:transform .4s var(--ease)}
.logo:hover{transform:rotate(-8deg) scale(1.06)}
.logo div{width:100%;height:100%;border-radius:50%;overflow:hidden;background:var(--card2)}
.logo img{width:100%;height:100%;object-fit:cover}
.nav{position:relative;display:flex;align-items:center;gap:2px;margin-inline:auto;font-size:.88rem;font-weight:700}
.nav a{position:relative;z-index:1;padding:8px 14px;border-radius:999px;color:var(--mut);transition:color .25s}
.nav a:hover,.nav a.on{color:var(--tx)}
.nav-ind{position:absolute;z-index:0;top:50%;height:34px;margin-top:-17px;border-radius:999px;background:linear-gradient(135deg,rgba(37,99,235,.18),rgba(124,58,237,.16));border:1px solid rgba(96,165,250,.28);transition:transform .45s var(--ease),width .45s var(--ease),opacity .3s;opacity:0;left:0;pointer-events:none}
.hdr-act{display:flex;align-items:center;gap:4px;padding-inline:4px;border-radius:999px;margin-inline-start:auto}
.nav+.hdr-act{margin-inline-start:0}
.ib{position:relative;overflow:hidden;width:40px;height:40px;border-radius:50%;display:inline-grid;place-items:center;color:var(--tx);transition:background .25s,transform .25s var(--ease)}
.ib:hover{background:rgba(148,163,184,.16)}.ib:active{transform:scale(.88)}
.ib.txt{font-size:.72rem;font-weight:900;letter-spacing:.02em;width:auto;min-width:40px;padding-inline:8px;border-radius:999px}
.ib .sun{display:none}.dark .ib .sun{display:block}.dark .ib .moon{display:none}
.ib.sw{background:linear-gradient(135deg,rgba(37,99,235,.2),rgba(6,182,212,.18));border:1px solid rgba(96,165,250,.3)}
.burger{display:none}
.burger i{position:absolute;left:11px;right:11px;height:2px;border-radius:2px;background:currentColor;transition:transform .35s var(--ease),opacity .2s,top .35s var(--ease)}
.burger i:nth-child(1){top:14px}.burger i:nth-child(2){top:19px}.burger i:nth-child(3){top:24px}
.burger.on i:nth-child(1){top:19px;transform:rotate(45deg)}.burger.on i:nth-child(2){opacity:0;transform:scaleX(0)}.burger.on i:nth-child(3){top:19px;transform:rotate(-45deg)}
.mnav{pointer-events:auto;position:absolute;inset-inline:14px;top:calc(100% + 8px);padding:10px;border-radius:26px;background:var(--glass);border:1px solid var(--line);box-shadow:var(--sh);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);display:grid;gap:2px;opacity:0;visibility:hidden;transform:translateY(-12px) scale(.98);transform-origin:top;transition:opacity .25s,transform .4s var(--ease),visibility .25s}
.mnav.show{opacity:1;visibility:visible;transform:none}
.mnav a{padding:13px 16px;border-radius:16px;font-weight:700;opacity:0;transform:translateY(-6px);transition:opacity .3s calc(var(--i)*40ms+60ms),transform .4s calc(var(--i)*40ms+60ms) var(--ease),background .2s}
.mnav.show a{opacity:1;transform:none}.mnav a:active,.mnav a.on{background:linear-gradient(135deg,rgba(37,99,235,.16),rgba(124,58,237,.12))}
@media(max-width:860px){.nav{display:none}.burger{display:inline-grid}.hdr-act{margin-inline-start:auto}.hdr-in{height:58px}}

/* ===== sections ===== */
.sec{padding:84px 0;position:relative}
.sec.tint{background:var(--bg2)}
.sh{text-align:center;margin-bottom:46px}
.sh h2{font-size:clamp(1.9rem,3.6vw,2.7rem);font-weight:900;line-height:1.3}
.sh p{margin-top:12px;color:var(--mut);max-width:640px;margin-inline:auto}
.sh .bar{width:64px;height:4px;border-radius:9px;margin:16px auto 0;background:linear-gradient(90deg,var(--p),var(--a));transform-origin:center;transition:transform .8s var(--ease) .15s;transform:scaleX(.2)}
.sh.in .bar{transform:none}
.rv{opacity:0;transform:translateY(16px);transition:opacity .7s var(--ease),transform .8s var(--ease)}
.rv.in{opacity:1;transform:none}.card.rv{transition:opacity .7s var(--ease),transform .8s var(--ease),border-color .3s,box-shadow .4s}.card.rv.in{transition:opacity .7s var(--ease),transform .45s var(--ease),border-color .3s,box-shadow .4s}

.grad{background:linear-gradient(120deg,#2563eb,#7c3aed,#06b6d4,#2563eb);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gshift 8s linear infinite}

/* hero */
.hero{padding:34px 0 84px}
.hero-g{display:grid;gap:44px;align-items:center}
@media(min-width:1024px){.hero-g{grid-template-columns:7fr 5fr}.hero{padding:56px 0 110px}}
.hero-t{text-align:center}@media(min-width:1024px){.hero-t{text-align:start}}
.badge{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;background:rgba(37,99,235,.08);color:#1d4ed8;border:1px solid rgba(37,99,235,.18);font-size:.86rem;font-weight:800}

.hero h1{margin-top:22px;font-size:clamp(2.4rem,6.4vw,4.2rem);font-weight:900;line-height:1.2}
.hero h1 small{display:block;font-size:.55em;font-weight:800;color:var(--mut)}
.hero h2{margin-top:18px;font-size:clamp(1.15rem,2.4vw,1.5rem);font-weight:800;color:var(--mut)}

@media(min-width:1024px){.hero p.bio{margin-inline:0}}
.hero-cta{margin-top:30px;display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
@media(min-width:1024px){.hero-cta{justify-content:flex-start}}
.hero-v{display:flex;justify-content:center;perspective:900px}
.pf{position:relative;width:min(78vw,330px);aspect-ratio:1;transition:transform .25s ease-out;transform-style:preserve-3d;will-change:transform}
.pf::before{content:'';position:absolute;inset:0;border-radius:2rem;background:linear-gradient(135deg,var(--p),var(--s));transform:rotate(6deg);filter:blur(14px);opacity:.5;transition:transform .6s var(--ease)}
.pf:hover::before{transform:rotate(11deg) scale(1.03)}
.pf-in{position:relative;width:100%;height:100%;border-radius:2rem;overflow:hidden;border:4px solid #fff;box-shadow:0 30px 60px -25px rgba(2,6,23,.65);background:#cbd5e1}
.dark .pf-in{border-color:#1e293b;background:#0f172a}
.pf-in img{width:100%;height:100%;object-fit:cover;object-position:top}
.pf .pulse{position:absolute;inset:0;border-radius:2rem;border:2px solid var(--a);opacity:0;pointer-events:none}
.pf.tap .pulse{animation:pf .8s ease-out}@keyframes pf{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(1.22)}}

/* buttons */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:13px 24px;border-radius:15px;font-weight:800;font-size:.95rem;line-height:1.2;transition:transform .25s var(--ease),box-shadow .3s,filter .25s,background .25s;isolation:isolate}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:scale(.96)}
.btn-wa{background:#059669;color:#fff;box-shadow:0 12px 26px -12px #059669}.btn-wa:hover{background:#047857}
.btn-p{background:var(--p);color:#fff;box-shadow:0 12px 26px -12px var(--p)}.btn-p:hover{filter:brightness(1.1)}
.btn-g{background:var(--card);border:1px solid var(--line);color:var(--tx)}.btn-g:hover{border-color:rgba(96,165,250,.5)}
.btn-d{background:rgba(148,163,184,.16)}
.btn-sm{padding:9px 14px;font-size:.84rem;border-radius:12px}

.btn .ic{transition:transform .3s var(--ease)}.btn:hover .ic.go{transform:translateX(-4px)}[dir=ltr] .btn:hover .ic.go{transform:translateX(4px)}
[dir=ltr] .ic.go{transform:none}[dir=rtl] .ic.go{transform:scaleX(-1)}[dir=rtl] .btn:hover .ic.go{transform:scaleX(-1) translateX(4px)}
.rip{position:absolute;border-radius:50%;pointer-events:none;background:currentColor;opacity:.22;transform:scale(0);animation:rip .65s ease-out forwards;z-index:0}
@keyframes rip{to{transform:scale(1);opacity:0}}
.fx-ring{position:fixed;pointer-events:none;width:20px;height:20px;margin:-10px 0 0 -10px;border:2px solid var(--p);border-radius:50%;z-index:9999;animation:fxring .6s ease-out forwards}
.fx-dot{position:fixed;pointer-events:none;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;z-index:9999;animation:fxdot .7s ease-out forwards}
@keyframes fxring{to{transform:scale(4.2);opacity:0}}@keyframes fxdot{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.no-clickfx .fx-ring,.no-clickfx .fx-dot{display:none}

/* cards */
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 1px 0 rgba(255,255,255,.04) inset;transition:transform .45s var(--ease),border-color .3s,box-shadow .4s;overflow:hidden}
.card::before{content:'';position:absolute;inset:0;border-radius:inherit;background:radial-gradient(260px circle at var(--mx,50%) var(--my,0%),rgba(59,130,246,.16),transparent 65%);opacity:0;transition:opacity .35s;pointer-events:none}
.card:hover::before{opacity:1}
.card.lift:hover{transform:translateY(-6px);border-color:rgba(96,165,250,.35);box-shadow:var(--sh)}
.card.lift:active{transform:translateY(-2px) scale(.985)}
.pad{padding:28px}
.grid{display:grid;gap:22px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.ic-t{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;font-size:1.5rem;background:rgba(37,99,235,.1);color:var(--p);transition:transform .5s var(--ease),background .3s,color .3s}
.card:hover .ic-t{transform:rotate(-8deg) scale(1.08);background:var(--p);color:#fff}
.svc h3{margin-top:20px;font-size:1.2rem;font-weight:900}.svc p{margin-top:12px;color:var(--mut);line-height:1.9}
.lnk{display:inline-flex;align-items:center;gap:6px;margin-top:16px;color:var(--p);font-weight:800;font-size:.9rem}
.dark .lnk{color:#60a5fa}

/* skills */
.skill{padding:20px}
.skill-h{display:flex;justify-content:space-between;gap:12px;font-weight:800;font-size:.92rem}
.skill-h b{color:var(--p)}.dark .skill-h b{color:#60a5fa}
.skill-b{margin-top:12px;height:10px;border-radius:99px;background:rgba(148,163,184,.2);overflow:hidden}
.skill-b i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,var(--p),var(--a));transition:width 1.3s var(--ease) .2s}.rv.in .skill-b i{width:var(--w)}
.about-g{display:grid;gap:40px;align-items:start}@media(min-width:1024px){.about-g{grid-template-columns:1fr 1fr}}
.about-g h3{font-size:1.6rem;font-weight:900;margin-bottom:16px}.about-g p{color:var(--mut);line-height:2}

/* portfolio */
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:34px}
.chip{position:relative;overflow:hidden;padding:10px 20px;border-radius:14px;font-weight:800;font-size:.9rem;background:var(--card2);border:1px solid var(--line);transition:transform .25s var(--ease),background .3s,color .3s,border-color .3s}
.chip:hover{border-color:rgba(96,165,250,.5)}.chip:active{transform:scale(.94)}
.chip.on{background:var(--p);color:#fff;border-color:var(--p);box-shadow:0 10px 22px -10px var(--p)}
.pj .cv{position:relative;aspect-ratio:4/3;overflow:hidden;background:rgba(148,163,184,.18);cursor:pointer}
.pj .cv img{width:100%;height:100%;object-fit:cover;transition:transform .8s var(--ease),filter .4s}
.pj:hover .cv img{transform:scale(1.07)}
.pj .cv::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(2,6,23,.55));opacity:0;transition:opacity .35s}
.pj:hover .cv::after{opacity:1}
.cnt{position:absolute;z-index:2;top:12px;inset-inline-start:12px;display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;font-size:.76rem;font-weight:800;color:#fff;background:rgba(2,6,23,.62);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.pj-b{padding:20px}.pj-b h3{font-size:1.1rem;font-weight:900}.pj-b p{margin-top:8px;font-size:.88rem;color:var(--mut);line-height:1.8}
.pj-a{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.pj-a .btn{flex:1;min-width:120px}
.empty{grid-column:1/-1;text-align:center;padding:48px 12px;color:var(--mut)}

/* experience */
.tl{position:relative;display:grid;gap:20px;max-width:860px;margin:0 auto;padding-inline-start:30px}
.tl::before{content:'';position:absolute;inset-block:8px;inset-inline-start:7px;width:2px;background:linear-gradient(var(--p),var(--s),transparent)}
.tl .card{padding:24px}.tl .card::after{content:'';position:absolute;inset-inline-start:-30px;top:30px;width:16px;height:16px;border-radius:50%;background:var(--bg);border:4px solid var(--p);box-shadow:0 0 0 4px rgba(37,99,235,.15)}
.tl small{color:var(--p);font-weight:800}.dark .tl small{color:#60a5fa}
.tl h3{margin-top:4px;font-size:1.2rem;font-weight:900}.tl .co{color:var(--mut);font-size:.9rem}.tl p{margin-top:12px;color:var(--mut);line-height:1.9}

/* reviews / forms */
.in{width:100%;padding:13px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card2);color:var(--tx);outline:0;transition:border-color .25s,box-shadow .25s}
.dark .in{background:#0f172a;border-color:#334155}
.in:focus{border-color:var(--p);box-shadow:0 0 0 4px rgba(37,99,235,.15)}
textarea.in{resize:vertical;min-height:90px}
.fm{display:grid;gap:14px}.fm2{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.rv-form{max-width:680px;margin:0 auto 36px;padding:22px}
.stars{display:flex;align-items:center;justify-content:center;gap:6px;padding:8px;border-radius:14px;border:1px solid var(--line);direction:ltr}
.stars button{font-size:1.7rem;line-height:1;color:#cbd5e1;transition:transform .25s var(--ease),color .2s}.dark .stars button{color:#334155}
.stars button.on{color:#fbbf24}.stars button:hover{transform:scale(1.25) rotate(-8deg)}
.stars button.pop{animation:starpop .45s var(--ease)}@keyframes starpop{40%{transform:scale(1.6) rotate(12deg)}}
.rcard{padding:22px}.rcard .t{display:flex;justify-content:space-between;gap:10px}.rcard .st{color:#f59e0b;letter-spacing:2px;direction:ltr}
.rcard p{margin-top:12px;color:var(--mut);line-height:1.9}
.soc{display:flex;flex-wrap:wrap;justify-content:center;gap:14px}
.soc a{position:relative;overflow:hidden;width:54px;height:54px;border-radius:18px;display:grid;place-items:center;font-size:1.3rem;background:var(--card2);border:1px solid var(--line);transition:transform .35s var(--ease),background .3s,color .3s,box-shadow .3s}
.soc a:hover{transform:translateY(-5px) rotate(-4deg);background:var(--p);color:#fff;box-shadow:0 14px 26px -12px var(--p)}.soc a:active{transform:scale(.9)}
.ct-g{display:grid;gap:26px}@media(min-width:1024px){.ct-g{grid-template-columns:2fr 3fr}}
.ci{display:flex;align-items:center;gap:14px;padding:18px 20px;transition:transform .3s var(--ease)}.ci:active{transform:scale(.98)}
.ci>i{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;background:rgba(148,163,184,.14);font-size:1.1rem}
.ci small{display:block;color:var(--mut);font-size:.76rem}.ci b{word-break:break-all}
.ct-l{display:grid;gap:14px;align-content:start}

/* custom sections */
.rich p+p{margin-top:14px}.rich{color:var(--mut);line-height:2;max-width:760px;margin-inline:auto}
.it-g{display:grid;gap:36px;align-items:center}@media(min-width:900px){.it-g{grid-template-columns:1fr 1fr}.it-g.rev .it-i{order:2}}
.it-i img{width:100%;border-radius:var(--r);box-shadow:var(--sh);cursor:zoom-in}
.stat{padding:26px;text-align:center}.stat b{display:block;font-size:2.4rem;font-weight:900;background:linear-gradient(120deg,var(--p),var(--a));-webkit-background-clip:text;background-clip:text;color:transparent}.stat span{color:var(--mut);font-weight:700}
.vid{max-width:900px;margin:0 auto;border-radius:var(--r);overflow:hidden;aspect-ratio:16/9;background:#000;box-shadow:var(--sh)}.vid iframe,.vid video{width:100%;height:100%;border:0}
.mas{columns:240px;column-gap:14px}.mas figure{margin:0 0 14px;break-inside:avoid;position:relative;border-radius:18px;overflow:hidden;cursor:zoom-in;background:rgba(148,163,184,.18)}
.mas img{width:100%;height:auto;transition:transform .7s var(--ease),filter .3s}.mas figure:hover img{transform:scale(1.05)}
.mas figure::after{content:'';position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);pointer-events:none}

footer{border-top:1px solid var(--line);padding:34px 16px;text-align:center;color:var(--mut);font-size:.88rem}

/* chat */
#chatWidget{position:fixed;bottom:20px;inset-inline-start:20px;z-index:70}
.no-chat #chatWidget{display:none}
#chatToggle{position:relative;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:1.4rem;background:linear-gradient(135deg,var(--p),var(--a));box-shadow:0 16px 34px -10px var(--p);transition:transform .35s var(--ease)}
#chatToggle:hover{transform:scale(1.08) rotate(-6deg)}#chatToggle:active{transform:scale(.9)}
#chatToggle.bump{animation:bump .6s var(--ease)}@keyframes bump{30%{transform:scale(1.25)}60%{transform:scale(.92)}}
#chatPanel{position:absolute;bottom:70px;inset-inline-start:0;width:min(340px,calc(100vw - 40px));background:var(--card2);border:1px solid var(--line);border-radius:26px;overflow:hidden;box-shadow:var(--sh);transform-origin:bottom left;transition:opacity .25s,transform .4s var(--ease),visibility .25s}
[dir=rtl] #chatPanel{transform-origin:bottom right}
#chatPanel.hid{opacity:0;visibility:hidden;transform:translateY(14px) scale(.92)}
.ch-h{padding:16px;background:#0f172a;color:#fff;display:flex;justify-content:space-between;align-items:center}.ch-h small{display:block;font-size:.68rem;color:#94a3b8}
#chatMessages{height:290px;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;-webkit-user-select:text;user-select:text}
.msg{max-width:86%;padding:10px 13px;border-radius:18px;font-size:.82rem;background:rgba(148,163,184,.2);animation:msgIn .35s var(--ease)}@keyframes msgIn{from{opacity:0;transform:translateY(8px) scale(.96)}}
.msg.me{background:var(--p);color:#fff;align-self:flex-end}.msg.ad{align-self:flex-start}
.ch-f{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}.ch-f .in{padding:10px 14px;font-size:.88rem}
.ch-f button{width:46px;border-radius:14px;background:var(--p);color:#fff;display:grid;place-items:center}
.ndot{min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:#ef4444;color:#fff;font-size:10px;line-height:18px;text-align:center;font-weight:900;animation:np 1.4s ease-in-out infinite}
@keyframes np{50%{transform:scale(1.12);box-shadow:0 0 0 7px rgba(239,68,68,0)}}
#chatToggle .ndot{position:absolute;top:-4px;inset-inline-end:-4px}
#toTop{position:fixed;bottom:22px;inset-inline-end:20px;z-index:65;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--glass);border:1px solid var(--line);box-shadow:var(--sh);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);opacity:0;visibility:hidden;transform:translateY(14px);transition:.35s var(--ease)}
#toTop.show{opacity:1;visibility:visible;transform:none}#toTop:active{transform:scale(.88)}
#toastHost{position:fixed;bottom:20px;inset-inline:0;z-index:300;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding-inline:12px}
.toast{display:flex;align-items:center;gap:10px;padding:12px 18px;border-radius:16px;color:#fff;font-weight:800;font-size:.88rem;box-shadow:0 18px 40px -14px rgba(0,0,0,.6);background:#059669;animation:toast 3.4s var(--ease) both;max-width:min(92vw,460px)}
.toast.bad{background:#e11d48}
@keyframes toast{0%{opacity:0;transform:translateY(18px) scale(.94)}10%,88%{opacity:1;transform:none}100%{opacity:0;transform:translateY(10px) scale(.96)}}

/* overlays */
.ov{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:14px;background:rgba(2,6,23,.74);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px)}
.ov.show{display:flex;animation:ovin .25s ease}.ov.out{animation:ovout .2s ease forwards}
@keyframes ovin{from{opacity:0}}@keyframes ovout{to{opacity:0}}
.pop{transform-origin:var(--ox,50%) var(--oy,50%);animation:popin .45s var(--ease)}.ov.out .pop{animation:popout .2s ease forwards}
@keyframes popin{from{opacity:0;transform:scale(.86) translateY(14px)}}@keyframes popout{to{opacity:0;transform:scale(.94)}}
.md{position:relative;width:100%;max-width:440px;padding:26px;background:var(--card2);border:1px solid var(--line);border-radius:28px;box-shadow:var(--sh);max-height:92vh;overflow:auto}
.md h3{font-size:1.5rem;font-weight:900;margin-bottom:18px}
.x{position:absolute;top:16px;inset-inline-end:16px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(148,163,184,.16);transition:transform .3s var(--ease),background .2s;z-index:3}.x:hover{background:rgba(148,163,184,.3);transform:rotate(90deg)}.x:active{transform:scale(.88)}
.pg{width:100%;max-width:1180px;max-height:94vh;overflow:auto;background:var(--card2);border:1px solid var(--line);border-radius:30px;box-shadow:var(--sh);overscroll-behavior:contain}
.pg-h{position:sticky;top:0;z-index:5;display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:22px 24px 16px;background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.pg-h .k{color:var(--p);font-weight:800;font-size:.84rem}.dark .pg-h .k{color:#60a5fa}.pg-h h3{margin-top:2px;font-size:clamp(1.4rem,3.4vw,2.2rem);font-weight:900;line-height:1.3}
.pg-h .x{position:static;flex:none}
.pg-b{padding:20px 24px 28px}.pg-b>p{color:var(--mut);line-height:2;max-width:760px}
.pg-m{display:inline-flex;align-items:center;gap:8px;margin:14px 0 22px;font-weight:800;font-size:.85rem;color:var(--mut)}
.pg-m .ic{color:var(--p)}
.gm{columns:250px;column-gap:14px}
.gm figure{margin:0 0 14px;break-inside:avoid;position:relative;border-radius:18px;overflow:hidden;cursor:zoom-in;background:rgba(148,163,184,.18);opacity:0;transform:translateY(12px) scale(.98);animation:gin .6s var(--ease) forwards;animation-delay:calc(var(--i,0)*35ms)}
@keyframes gin{to{opacity:1;transform:none}}
.gm img{width:100%;height:auto;min-height:80px;transition:transform .7s var(--ease)}.gm figure:hover img{transform:scale(1.06)}
.gm figure::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 60%,rgba(2,6,23,.5));opacity:0;transition:opacity .3s}.gm figure:hover::after{opacity:1}
.gm .zi{position:absolute;z-index:2;bottom:10px;inset-inline-end:10px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;background:rgba(2,6,23,.6);opacity:0;transform:scale(.7);transition:.3s var(--ease)}.gm figure:hover .zi{opacity:1;transform:none}
.pg-c{display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr))}

/* lightbox */
.lb{position:fixed;inset:0;z-index:150;display:none;flex-direction:column;background:rgba(2,6,23,.97);color:#fff;touch-action:none;-webkit-user-select:none;user-select:none}
.lb.show{display:flex;animation:ovin .3s ease}.lb.out{animation:ovout .2s ease forwards}
.lb-top{position:relative;z-index:4;display:flex;align-items:center;gap:6px;padding:12px 14px;background:linear-gradient(180deg,rgba(2,6,23,.85),transparent)}
.lb-top .sp{flex:1;min-width:0}.lb-ttl{font-weight:800;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-cnt{font-size:.82rem;font-weight:800;padding:5px 12px;border-radius:99px;background:rgba(148,163,184,.18);direction:ltr}
.lb .ib{color:#fff;background:rgba(148,163,184,.14)}.lb .ib:hover{background:rgba(148,163,184,.3)}
.lb .ib.on{background:var(--p)}
.lb-st{position:relative;flex:1;min-height:0;overflow:hidden;display:grid;place-items:center;cursor:grab}
.lb-st.pan{cursor:grabbing}.lb-st.zm{cursor:grab}
.lb-img{max-width:100%;max-height:100%;object-fit:contain;transform-origin:center;will-change:transform;transition:opacity .35s;-webkit-user-drag:none;touch-action:none}
.lb-img.sw{transition:transform .35s var(--ease),opacity .35s}
.lb-ph{position:absolute;max-width:100%;max-height:100%;object-fit:contain;filter:blur(18px);transform:scale(1.02);opacity:.55;pointer-events:none;transition:opacity .4s}
.lb-spin{position:absolute;width:42px;height:42px;border-radius:50%;border:3px solid rgba(148,163,184,.3);border-top-color:#60a5fa;animation:spin .8s linear infinite;pointer-events:none}
.lb-nv{overflow:hidden;position:absolute;z-index:4;top:50%;width:52px;height:52px;margin-top:-26px;border-radius:50%;display:grid;place-items:center;background:rgba(148,163,184,.16);color:#fff;transition:.25s var(--ease)}
.lb-nv:hover{background:var(--p);transform:scale(1.1)}.lb-nv:active{transform:scale(.9)}
.lb-nv.pv{left:14px}.lb-nv.nx{right:14px}
.lb-cap{position:relative;z-index:4;text-align:center;font-size:.9rem;color:#cbd5e1;padding:4px 70px 8px;min-height:8px}
.lb-th{position:relative;z-index:4;display:flex;gap:8px;overflow-x:auto;padding:8px 14px 14px;justify-content:safe center;scrollbar-width:thin}
.lb-th button{flex:none;width:62px;height:62px;border-radius:12px;overflow:hidden;opacity:.5;border:2px solid transparent;transition:.3s var(--ease)}
.lb-th button img{width:100%;height:100%;object-fit:cover}.lb-th button.on{opacity:1;border-color:var(--a);transform:translateY(-3px)}.lb-th button:hover{opacity:1}
.lb-hint{position:absolute;z-index:3;bottom:14px;left:50%;transform:translateX(-50%);padding:6px 14px;border-radius:99px;background:rgba(148,163,184,.2);font-size:.76rem;font-weight:700;animation:toast 3.6s ease both;pointer-events:none}
@media(max-width:700px){.lb-nv{width:42px;height:42px;margin-top:-21px}.lb-th button{width:50px;height:50px}.lb-nv.pv{left:6px}.lb-nv.nx{right:6px}}

/* theme view transition */
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-new(root){animation:vtReveal .75s var(--ease)}
@keyframes vtReveal{from{clip-path:circle(0 at var(--vx,50%) var(--vy,0))}to{clip-path:circle(150vmax at var(--vx,50%) var(--vy,0))}}
body.langsw main,body.langsw .hdr,body.langsw footer{opacity:.0;transition:opacity .16s}
main,.hdr,footer{transition:opacity .22s}

/* ===== admin ===== */
#adminDrawer{position:fixed;inset-block:0;right:0;z-index:95;width:min(1120px,100%);display:flex;flex-direction:column;background:var(--bg);border-left:1px solid var(--line);box-shadow:-30px 0 80px -30px rgba(0,0,0,.7);transform:translateX(105%);visibility:hidden;transition:transform .45s var(--ease),visibility .45s;direction:rtl;text-align:right}
#adminDrawer.show{transform:none;visibility:visible}
.ad-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--card2)}
.ad-h h2{font-size:1.1rem;font-weight:900}.ad-h p{font-size:.74rem;color:var(--mut)}
.cloud{padding:7px 12px;border-radius:12px;font-size:.74rem;font-weight:800;color:#fff;background:#d97706}.cloud.ok{background:#059669}.cloud.err{background:#e11d48}
.ad-b{display:flex;flex:1;min-height:0}
.ad-s{width:220px;flex:none;overflow-y:auto;padding:12px 10px;border-inline-end:1px solid var(--line);background:var(--card2)}
.ad-s h6{margin:14px 10px 6px;font-size:.7rem;font-weight:800;color:var(--mut);letter-spacing:.04em}
.ad-s h6:first-child{margin-top:2px}
.atab{position:relative;display:flex;align-items:center;gap:10px;width:100%;text-align:start;padding:10px 12px;border-radius:14px;font-weight:800;font-size:.88rem;color:var(--mut);transition:background .2s,color .2s,transform .2s}
.atab:hover{background:rgba(148,163,184,.14);color:var(--tx)}.atab:active{transform:scale(.97)}
.atab.on{background:var(--p);color:#fff;box-shadow:0 10px 22px -12px var(--p)}.atab i{width:18px;text-align:center}
.atab .ndot{margin-inline-start:auto}
.ad-c{flex:1;min-width:0;overflow-y:auto;padding:22px 22px 0;scroll-behavior:auto}
.ad-c>h3{font-size:1.3rem;font-weight:900}.ad-c>.sub{color:var(--mut);font-size:.86rem;margin:4px 0 20px}
.ac{background:var(--card2);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px}
.ac h4{font-weight:900;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.af{display:grid;gap:5px;align-content:start}.af>span{font-size:.76rem;font-weight:800;color:var(--mut)}.af>small{font-size:.7rem;color:var(--mut)}

function trFallback(k){
 let out=k,hit=false;
 for(const key of TRX.keys){
  let i=out.indexOf(key);
  while(i>-1){
   const b=out[i-1],a=out[i+key.length];
   if((!b||!AR.test(b))&&(!a||!AR.test(a))){const v=TRX.map.get(key);out=out.slice(0,i)+v+out.slice(i+key.length);hit=true;i=out.indexOf(key,i+v.length)}
   else i=out.indexOf(key,i+1);
  }
 }
 return hit?out:k;
}
function tr(s){
 const raw=String(s??'');const k=nk(raw);if(!k)return raw;
 let r=TRX.cache.get(k);
 if(r===undefined){r=TRX.map.get(k);if(r===undefined)r=AR.test(k)?trFallback(k):k;TRX.cache.set(k,r)}

}

let obsReveal=null,obsSpy=null;
function revealObserve(root){
 const els=$$('.rv:not(.in)',root);if(!els.length)return;
 if(!('IntersectionObserver'in window)||reduce){els.forEach(e=>e.classList.add('in'));return}
 if(!obsReveal)obsReveal=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){const t=e.target;t.classList.add('in');obsReveal.unobserve(t);setTimeout(()=>{t.style.transitionDelay=''},1000)}})},{threshold:.12,rootMargin:'0px 0px -5% 0px'});
 els.forEach(e=>obsReveal.observe(e));
}
const secHash=new Map(),secCls=new Map();
function renderSections(){
 const main=$('main');let alt=0;const keep=new Set();let idx=0;
 S.sections.forEach(sec=>{
  if(sec.visible===false||!BUILD[sec.type])return;
  const html=BUILD[sec.type](sec);if(!html)return;
  let tint=false;
  if(sec.type!=='hero'){tint=sec.bg==='tint'||(sec.bg!=='plain'&&alt%2===0);alt++}
  const cls=sec.type==='hero'?'hero':'sec'+(tint?' tint':'');
  let el=document.getElementById(sec.id);
  if(!el||el.parentElement!==main){el=document.createElement('section');el.id=sec.id;main.appendChild(el)}
  el.dataset.sec=sec.id;
  const key=hash(cls+html);
  secCls.set(sec.id,cls);
  if(secHash.get(sec.id)!==key){el.className=cls;el.innerHTML=html;secHash.set(sec.id,key);revealObserve(el)}
  keep.add(sec.id);
  if(main.children[idx]!==el)main.insertBefore(el,main.children[idx]||null);
  idx++;
 });
 [...main.children].forEach(c=>{if(!keep.has(c.id)){c.remove();secHash.delete(c.id)}});
}

 $$('#lbTh button').forEach((b,j)=>{b.classList.toggle('on',j===i);if(j===i)b.scrollIntoView({block:'nearest',inline:'center',behavior:reduce?'auto':'smooth'})});

/* ----- أدوات الرفع ----- */
function putFile(path,file,onp){
 return new Promise((res,rej)=>{
  const r=ref(storage,path);
  const task=uploadBytesResumable(r,file,{contentType:file.type||'image/jpeg',cacheControl:'public,max-age=31536000'});
  task.on('state_changed',s=>onp&&onp(s.bytesTransferred/Math.max(1,s.totalBytes)),rej,async()=>{try{res(await getDownloadURL(r))}catch(e){rej(e)}});
 });
}
async function rmFile(path){if(!path)return;try{await deleteObject(ref(storage,path))}catch(e){if(e?.code!=='storage/object-not-found')console.warn('rm',path,e)}}
async function makeThumb(file,max=1000,q=.86){
 if(!/^image\/(jpeg|png|webp|gif|bmp|avif)$/i.test(file.type)||!window.createImageBitmap)return null;
 try{
  const bmp=await createImageBitmap(file);const w0=bmp.width,h0=bmp.height;
  if(Math.max(w0,h0)<=max*1.15){bmp.close?.();return{w:w0,h:h0,blob:null}}
  const sc=max/Math.max(w0,h0),w=Math.round(w0*sc),h=Math.round(h0*sc);
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.imageSmoothingQuality='high';
  const png=file.type==='image/png';if(!png){x.fillStyle='#fff';x.fillRect(0,0,w,h)}
  x.drawImage(bmp,0,0,w,h);bmp.close?.();
  const type=png?'image/png':'image/jpeg';
  const blob=await new Promise(r=>c.toBlob(r,type,q));
  return blob?{w:w0,h:h0,blob,ext:png?'png':'jpg'}:{w:w0,h:h0,blob:null};
 }catch{return null}
}
async function uploadImage(file,folder,onp){
 const safe=(file.name.replace(/[^a-zA-Z0-9._-]/g,'_')||'img').slice(-60),stamp=Date.now()+'-'+Math.random().toString(36).slice(2,6);
 const info=await makeThumb(file);const two=!!(info&&info.blob);
 const path=`${folder}/${stamp}-${safe}`;
 const url=await putFile(path,file,p=>onp&&onp(p*(two?.75:1)));
 let thumb=url,tpath='';
 if(two){tpath=`${folder}/thumbs/${stamp}.${info.ext}`;thumb=await putFile(tpath,info.blob,p=>onp&&onp(.75+p*.25))}
 return{url,thumb,path,tpath,w:info?.w||0,h:info?.h||0};
}
async function uploadMany(target,files){
 const [kind,id]=[target.slice(0,target.indexOf(':')),target.slice(target.indexOf(':')+1)];
 const box=document.getElementById('upl-'+kind+'-'+id);
 files=files.filter(f=>f.type.startsWith('image/'));if(!files.length)return toast('اختر ملفات صور فقط',false);
 const rows=files.map(f=>{const r=document.createElement('div');r.className='upr';r.innerHTML=`<span class="n"></span><span class="b"><i></i></span><span class="s">⏳</span>`;r.querySelector('.n').textContent=f.name;box?.appendChild(r);return r});
 window.__upl=(window.__upl||0)+1;
 let ok=0,fail=0,idx=0;
 const proj=kind==='proj'?st().projects.findIndex(p=>p.id===id):-1;
 const sec=kind==='sec'?st().sections.find(s=>s.id===id):null;
 const worker=async()=>{
  while(idx<files.length){
   const n=idx++,f=files[n],row=rows[n];
   try{
    const folder=kind==='proj'?`projects/gallery/${id}`:`site/sections/${id}`;
    const r=await uploadImage(f,folder,p=>{row.querySelector('.b i').style.width=Math.round(p*100)+'%'});
    if(kind==='proj'){
     await addDoc(collection(db,'projectImages'),{projectId:id,projectIndex:proj,url:r.url,thumb:r.thumb,storagePath:r.path,thumbPath:r.tpath,order:Date.now()*1000+n,filename:f.name,w:r.w,h:r.h,size:f.size,createdAt:serverTimestamp()});
    }else if(sec){(sec.images=sec.images||[]).push({url:r.url,thumb:r.thumb,path:r.path,tpath:r.tpath,cap:''})}
    row.querySelector('.s').textContent='✅';ok++;
   }catch(e){console.error(e);row.querySelector('.s').textContent='❌';row.title=friendlyCloudError(e);fail++}
  }
 };
 await Promise.all([worker(),worker()]);
 window.__upl--;
 if(kind==='sec'&&ok){try{await saveState()}catch{}A.render()}
 toast(`تم رفع ${ok} صورة${fail?` — فشل ${fail}`:''}`,!fail);
 if(fail&&!ok)toast(friendlyCloudError({code:'storage/unknown'}),false);
 if(!window.__upl)renderAdmin(true);
 setTimeout(()=>rows.forEach(r=>r.remove()),2500);
}

function secEditor(sec,i){
 const b=`sections.${i}`;
 if(A.BUILTIN.includes(sec.type))return`<div class="info">${SEC_NOTE[sec.type]||''} ${TABMAP[sec.type]?`<button class="bsm pri" data-goto="${TABMAP[sec.type]}">فتح التبويب</button>`:''}</div>`;
 const T={
  text:()=>`<div class="ag w">${F('النص (كل سطر جديد = فقرة)',b+'.body',{ta:1,rows:6})}${SEL('المحاذاة',b+'.align',[['center','وسط'],['start','بداية السطر']])}</div>`,
  imagetext:()=>`<div class="ag">${F('النص',b+'.body',{ta:1,rows:6,cls:'full'})}${UP('الصورة',b+'.image','site/sections/'+sec.id)}${SEL('مكان الصورة',b+'.side',[['start','بجانب النص (البداية)'],['end','بجانب النص (النهاية)']])}${F('نص الزر (اختياري)',b+'.btnText')}${F('رابط الزر',b+'.btnUrl',{dir:'ltr'})}</div>`,
  cards:()=>`<div class="ag w">${(sec.items||[]).map((c,k)=>`<div class="ac"><div class="ag">${F('العنوان',`${b}.items.${k}.title`)}${F('الأيقونة (Font Awesome)',`${b}.items.${k}.icon`,{dir:'ltr',ph:'fa-star'})}${F('الوصف',`${b}.items.${k}.desc`,{ta:1,rows:2,cls:'full'})}${F('رابط (اختياري)',`${b}.items.${k}.url`,{dir:'ltr',cls:'full'})}</div><div class="ar" style="margin-top:10px">${MV(b+'.items',k,sec.items.length)}${ACT('del',b+'.items',k,'حذف','dng')}</div></div>`).join('')}${ACT('add',b+'.items',0,'+ إضافة بطاقة','dark')}</div>`,
  stats:()=>`<div class="ag w">${(sec.items||[]).map((c,k)=>`<div class="ac"><div class="ag">${F('الرقم',`${b}.items.${k}.num`,{dir:'ltr'})}${F('الوصف',`${b}.items.${k}.label`)}</div><div class="ar" style="margin-top:10px">${MV(b+'.items',k,sec.items.length)}${ACT('del',b+'.items',k,'حذف','dng')}</div></div>`).join('')}${ACT('add',b+'.items',0,'+ إضافة رقم','dark')}</div>`,
  video:()=>`<div class="ag w">${F('رابط الفيديو (YouTube أو Vimeo أو ملف mp4)',b+'.url',{dir:'ltr'})}</div>`,
  html:()=>`<div class="ag w">${F('كود HTML',b+'.html',{ta:1,rows:8,code:1,small:'يظهر كما هو داخل الصفحة.'})}</div>`,
  gallery:()=>`<label class="dz" data-target="sec:${sec.id}"><i class="fa-solid fa-cloud-arrow-up"></i><span>اسحب الصور هنا أو اضغط للاختيار</span><small>تُرفع بجودتها الأصلية</small><input class="dzf" type="file" accept="image/*" multiple hidden data-target="sec:${sec.id}"></label><div class="upl" id="upl-sec-${sec.id}"></div><div class="thumbs">${(sec.images||[]).map((x,k)=>`<div class="th"><img src="${esc(A.safeUrl(x.thumb||x.url))}" alt="" loading="lazy"><div class="tb"><button title="تقديم" data-gact="left" data-kind="sec" data-id="${sec.id}" data-i="${k}"><i class="fa-solid fa-chevron-right"></i></button><button title="تأخير" data-gact="right" data-kind="sec" data-id="${sec.id}" data-i="${k}"><i class="fa-solid fa-chevron-left"></i></button><button class="d" title="حذف" data-gact="del" data-kind="sec" data-id="${sec.id}" data-i="${k}"><i class="fa-solid fa-trash"></i></button></div></div>`).join('')}</div>`
 };
 return(T[sec.type]||(()=>''))();
}

  trRows=collectStrings();
  const miss=trRows.filter(a=>!A.lookup(a)).length;
  const list=trRows.map((ar,i)=>({ar,i})).filter(x=>!trOnlyMissing||!A.lookup(x.ar));

 reviews:()=>H('الآراء','آراء الزوار تظهر بعد موافقتك')+`<div>${adminReviews.length?adminReviews.map(r=>`<div class="ac"><div class="ar"><b>${esc(r.author||'عميل')}</b><span style="color:#f59e0b">${'★'.repeat(Number(r.rating)||5)}</span><span class="bsm ${r.approved?'ok':''}" style="pointer-events:none">${r.approved?'منشور':'بانتظار الموافقة'}</span></div><p style="margin:10px 0;color:var(--mut);line-height:1.8">${esc(r.text)}</p><div class="ar">${!r.approved?`<button class="bsm ok approveReview" data-id="${r.id}">موافقة ونشر</button>`:''}<button class="bsm dng rejectReview" data-id="${r.id}">حذف</button></div></div>`).join(''):'<p class="sub">لا توجد آراء حاليًا.</p>'}</div>
  <div class="ac"><h4>إضافة رأي بنفسك</h4><div class="ag"><label class="af"><span>الاسم</span><input id="newReviewAuthor" class="in" value="عميل"></label><div class="af"><span>التقييم</span><div class="ar" style="font-size:1.6rem">${[1,2,3,4,5].map(n=>`<button type="button" class="adminStar" data-r="${n}" style="color:#fbbf24">★</button>`).join('')}</div><input id="newReviewRating" type="hidden" value="5"></div><label class="af full"><span>الرأي</span><textarea id="newReviewText" class="in" rows="3"></textarea></label></div><button id="adminAddReview" class="bsm pri" style="margin-top:12px">إضافة ونشر</button></div>`,
 contacts:()=>H('طلبات التواصل','الطلبات المرسلة من نموذج «تواصل معي»')+(contacts.map(c=>`<div class="ac"><div class="ar" style="justify-content:space-between"><b>${esc(c.name)}</b><span class="bsm ${c.read?'':'pri'}" style="pointer-events:none">${c.read?'تمت القراءة':'جديد'}</span></div><p style="margin-top:8px;font-weight:700">${esc(c.service)}</p><p style="color:var(--mut)" dir="auto">${esc(c.contact)}</p><p style="margin:10px 0;line-height:1.9">${esc(c.details)}</p><div class="ar">${c.read?'':`<button class="bsm markContact" data-id="${c.id}">تحديد كمقروء</button>`}<button class="bsm dng delContact" data-id="${c.id}">حذف</button></div></div>`).join('')||'<p class="sub">لا توجد طلبات.</p>'),
 messages:()=>{
  const groups={};messages.forEach(m=>{const u=m.uid||'unknown';(groups[u]=groups[u]||[]).push(m)});
  const convs=Object.entries(groups).map(([uid,arr])=>{arr.sort((a,b)=>(a.createdAt?.seconds||0)-(b.createdAt?.seconds||0));const last=arr[arr.length-1],unread=arr.filter(m=>!m.fromAdmin&&!m.readByAdmin).length,u=users.find(x=>x.uid===uid)||{};return{uid,arr,last,unread,name:u.name||last?.sender||'عميل',email:u.email||''}}).sort((a,b)=>(b.last?.createdAt?.seconds||0)-(a.last?.createdAt?.seconds||0));
  if(!selectedChatUid||!groups[selectedChatUid])selectedChatUid=convs[0]?.uid||'';
  const c=convs.find(x=>x.uid===selectedChatUid);
  return H('المحادثات',adminUnread?`🔔 عندك ${adminUnread} رسالة جديدة`:'لا توجد رسائل جديدة')+`<div style="display:grid;gap:14px;grid-template-columns:minmax(0,280px) minmax(0,1fr)" class="msgg"><div class="ac" style="margin:0;max-height:560px;overflow:auto"><h4>العملاء</h4><div style="display:grid;gap:6px">${convs.map(x=>`<button class="chatConv atab ${x.uid===selectedChatUid?'on':''}" data-uid="${esc(x.uid)}" style="display:block"><div class="ar" style="justify-content:space-between;flex-wrap:nowrap"><b style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.name)}</b>${x.unread?`<span class="ndot">${x.unread}</span>`:''}</div><div style="font-size:.7rem;opacity:.7;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:3px">${esc(x.last?.text||'')}</div></button>`).join('')||'<p class="sub">لا توجد محادثات.</p>'}</div></div>
  <div class="ac" style="margin:0"><div style="padding-bottom:10px;border-bottom:1px solid var(--line)"><b>${esc(c?.name||'اختر محادثة')}</b><div style="font-size:.74rem;color:var(--mut)">${esc(c?.email||'')}</div></div><div id="adminChatThread" style="max-height:380px;overflow:auto;padding:14px 0;display:grid;gap:8px">${c?c.arr.map(m=>`<div class="ar" style="flex-wrap:nowrap;justify-content:${m.fromAdmin?'flex-start':'flex-end'}"><div class="msg ${m.fromAdmin?'me':'ad'}" style="max-width:100%"><div>${esc(m.text)}</div><div style="font-size:9px;opacity:.6;margin-top:3px">${m.fromAdmin?'أنت':'العميل'}</div></div><button class="bsm dng deleteChatMessage" data-id="${m.id}" aria-label="حذف"><i class="fa-solid fa-trash"></i></button></div>`).join(''):'<p class="sub">اختر عميلًا لعرض المحادثة.</p>'}</div>${c?`<div class="ar" style="flex-wrap:nowrap"><input id="adminReplyInput" class="in" placeholder="اكتب ردك للعميل..."><button id="sendSelectedReply" data-uid="${esc(c.uid)}" class="bsm pri" style="padding:13px 20px">إرسال</button></div><button id="deleteSelectedChat" data-uid="${esc(c.uid)}" class="bsm dng" style="margin-top:10px"><i class="fa-solid fa-trash"></i> حذف المحادثة بالكامل</button>`:''}</div></div>`;
 },
 users:()=>H('الأشخاص المسجلون','حسابات العملاء')+`<div class="warn">كلمة المرور الأصلية لا يمكن عرضها من Firebase. يمكنك إرسال رابط إعادة تعيين أو حذف بيانات الحساب. حذف حساب تسجيل الدخول نفسه يحتاج Firebase Admin SDK.</div><button id="syncLoginIndex" class="bsm pri" style="margin:14px 0">تحديث تسجيل الدخول بالاسم والهاتف</button>`+(users.map(u=>`<div class="ac"><b>${esc(u.name||'بدون اسم')}</b><div style="font-size:.84rem;color:var(--mut);margin-top:4px" dir="auto">${esc(u.email||'')} ${u.phone?' • '+esc(u.phone):''}</div><div style="font-size:.7rem;color:var(--mut);margin-top:6px;direction:ltr;text-align:right">UID: ${esc(u.uid||'')}</div><div class="ar" style="margin-top:10px"><button class="bsm resetUserPass" data-email="${esc(u.email||'')}">إعادة تعيين كلمة المرور</button><button class="bsm dng deleteUserData" data-id="${esc(u.id||u.uid||'')}">حذف بيانات الحساب</button></div></div>`).join('')||'<p class="sub">لا توجد حسابات بعد.</p>'),
 backup:()=>H('نسخ احتياطي واستعادة','احفظ نسخة من كل محتوى الموقع، أو استرجع نسخة سابقة')+`<div class="ac"><div class="ar"><button id="exportBtn" class="bsm pri"><i class="fa-solid fa-download"></i> تنزيل نسخة احتياطية</button><button id="importBtn" class="bsm"><i class="fa-solid fa-upload"></i> استعادة من ملف</button><input type="file" id="importFile" accept=".json,application/json" hidden></div><p class="sub" style="margin:12px 0 0">النسخة تشمل النصوص والإعدادات والأقسام والترجمات وروابط الصور (الصور نفسها تبقى في التخزين).</p></div><div class="ac"><h4>إعادة الضبط</h4><button id="resetBtn" class="bsm dng">إرجاع الإعدادات للافتراضي</button></div>`,
 security:()=>H('الأمان','')+`<div class="ac" style="max-width:560px"><h4>تغيير كلمة مرور لوحة التحكم</h4><div class="ag w"><label class="af"><span>كلمة المرور الحالية</span><input id="oldAdminPass" type="password" class="in" autocomplete="current-password"></label><label class="af"><span>كلمة المرور الجديدة</span><input id="newAdminPass" type="password" class="in" autocomplete="new-password"></label><label class="af"><span>تأكيد كلمة المرور الجديدة</span><input id="newAdminPass2" type="password" class="in" autocomplete="new-password"></label></div><button id="changeAdminPass" class="bsm pri" style="margin-top:12px">تغيير كلمة المرور</button></div>`
};
if(matchMedia('(max-width:820px)').matches)document.head.insertAdjacentHTML('beforeend','<style>.msgg{grid-template-columns:1fr!important}</style>');

/* ----- الترجمة ----- */
function collectStrings(){
 const m=new Map(),add=s=>String(s||'').split(/\n+/).forEach(x=>{x=x.trim();if(x&&A.AR.test(x)&&!m.has(x))m.set(x,1)});
 const SK=new Set(['id','img','thumb','url','icon','image','html','type','visible','nav','bg','side','align','path','tpath','storagePath','thumbPath','category','btnUrl','email','phone','whatsapp','website','mapUrl']);
 const w=(v,k)=>{if(typeof v==='string'){if(!SK.has(k))add(v)}else if(Array.isArray(v))v.forEach(x=>w(x,k));else if(v&&typeof v==='object')for(const kk in v)if(!SK.has(kk))w(v[kk],kk)};
 const s=st();
 ['name','title','badge','bio','aboutHeading','aboutDetail','location'].forEach(k=>add(s[k]));
 ['skills','categories','services','projects','experiences','extraLinks','sections','seo','footer'].forEach(k=>w(s[k],k));
 (s.ui.tickerText||'').split('|').forEach(add);add(s.ui.loaderText);
 Object.values(s.labels||{}).forEach(add);for(const k in A.LABELS)add(A.L(k));
 A.reviews.forEach(r=>add(r.text));
 return[...m.keys()];
}
async function mm(text){
 const parts=[];let cur='';
 (text.match(/[^.!؟?\n]+[.!؟?]?\s*/g)||[text]).forEach(p=>{if((cur+p).length>420){if(cur)parts.push(cur);cur=p}else cur+=p});if(cur)parts.push(cur);
 let out='';
 for(const p of parts){
  const r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(p.trim())+'&langpair=ar|en');
  const j=await r.json();const t=j?.responseData?.translatedText;
  if(!t||/MYMEMORY WARNING|INVALID/i.test(t))throw new Error('limit');out+=(out?' ':'')+t;
 }
 return out;
}
async function autoTranslate(){
 const todo=trRows.map((ar,i)=>({ar,i})).filter(x=>!A.lookup(x.ar)&&!st().tr[x.ar]);
 if(!todo.length)return;const b=$('trAuto');b.disabled=true;let ok=0;
 for(const {ar,i} of todo){
  b.textContent=`جاري الترجمة… ${ok}/${todo.length}`;
  try{const en=await mm(ar);st().tr[ar]=en;ok++;const ta=document.querySelector(`[data-tr="${i}"]`);if(ta){ta.value=en;ta.closest('.tr-r')?.classList.remove('miss')}markDirty()}
  catch(e){toast('توقفت الترجمة التلقائية (قد تكون وصلت للحد المجاني أو لا يوجد اتصال). أكمل الباقي يدويًا.',false);break}
 }
 A.render();toast(`تمت ترجمة ${ok} نص — راجعها ثم اضغط حفظ`,ok>0);renderAdmin(true);
}

/* ----- نسخ احتياطي ----- */
function exportData(){
 const blob=new Blob([JSON.stringify({app:'abdelrahman-site',version:2,exportedAt:new Date().toISOString(),state:clean()},null,2)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='site-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}
$('adminContent').addEventListener('change',async e=>{
 if(e.target.id!=='importFile'||!e.target.files[0])return;
 try{const j=JSON.parse(await e.target.files[0].text());const d=j.state||j;if(!d||typeof d!=='object'||!d.name)throw 0;
  if(!confirm('سيتم استبدال المحتوى الحالي بمحتوى الملف (لن يُنشر إلا بعد الحفظ). متابعة؟'))return;
  A.state=A.normalize(d);markDirty();A.render();renderAdmin();toast('تم تحميل النسخة — اضغط حفظ ونشر')}
 catch{toast('الملف غير صالح',false)}
 e.target.value='';
});

/* ----- الآراء / المحادثات / الأشخاص / الأمان ----- */
async function addAdminReview(){
 const text=$('newReviewText').value.trim();if(!text)return toast('اكتب الرأي أولاً',false);
 await addDoc(collection(db,'reviews'),{author:$('newReviewAuthor').value||'عميل',text,rating:+$('newReviewRating').value||5,approved:true,createdAt:serverTimestamp()});toast('تمت إضافة الرأي ونشره');$('newReviewText').value='';
}
async function syncLoginIndex(){
 try{for(const u of users){if(u.phone)await setDoc(doc(db,'loginIndex',loginIndexId('phone',phoneNorm(u.phone))),{uid:u.uid,email:u.email,name:u.name||'',kind:'phone'});if(u.name)await setDoc(doc(db,'loginIndex',loginIndexId('name',u.name)),{uid:u.uid,email:u.email,name:u.name||'',kind:'name'})}toast('تم تحديث تسجيل الدخول بالاسم والهاتف')}catch{toast('تعذر تحديث فهرس تسجيل الدخول',false)}
}
async function sendReply(btn){
 const uid=btn.dataset.uid,text=$('adminReplyInput').value.trim();if(!uid||!text)return;btn.disabled=true;
 try{await addDoc(collection(db,'messages'),{uid,text,sender:'الإدارة',fromAdmin:true,readByClient:false,readByAdmin:true,createdAt:serverTimestamp()});$('adminReplyInput').value='';toast('تم إرسال الرد')}
 catch(e){console.error(e);toast('تعذر إرسال الرد: '+(e?.message||''),false)}finally{btn.disabled=false}
}
async function deleteChat(btn){
 const uid=btn.dataset.uid;if(!uid||!confirm('سيتم حذف كل رسائل المحادثة نهائيًا. هل تريد المتابعة؟'))return;btn.disabled=true;
 try{const snap=await getDocs(query(collection(db,'messages'),where('uid','==',uid)));for(const d of snap.docs)await deleteDoc(doc(db,'messages',d.id));selectedChatUid='';toast('تم حذف المحادثة بالكامل');renderAdmin()}
 catch(e){console.error(e);toast('تعذر حذف المحادثة. تحقق من الصلاحيات والاتصال.',false)}finally{if(btn.isConnected)btn.disabled=false}
}
async function changePass(){
 const oldP=$('oldAdminPass').value,newP=$('newAdminPass').value,newP2=$('newAdminPass2').value;
 if(newP.length<6||newP!==newP2)return toast('كلمة المرور الجديدة يجب أن تكون 6 أحرف على الأقل ومتطابقة',false);
 try{await reauthenticateWithCredential(auth.currentUser,EmailAuthProvider.credential(ADMIN_EMAIL,oldP));await updatePassword(auth.currentUser,newP);toast('تم تغيير كلمة مرور الإدارة بنجاح')}catch(e){toast(authMsg(e),false)}
}

/* ----- تيارات بيانات الإدارة ----- */
function startAdminStreams(){
 adminUnsubs.forEach(f=>f&&f());adminUnsubs=[];
 const rr=tab=>{renderTabs();if(activeTab===tab||(tab==='messages'&&activeTab==='home')||activeTab==='home')renderAdmin(true)};
 adminUnsubs.push(onSnapshot(query(collection(db,'contacts'),orderBy('createdAt','desc')),s=>{contacts=s.docs.map(d=>({id:d.id,...d.data()}));rr('contacts')}));
 adminUnsubs.push(onSnapshot(collection(db,'users'),s=>{users=s.docs.map(d=>({id:d.id,...d.data()}));rr('users')}));
 adminUnsubs.push(onSnapshot(query(collection(db,'messages'),orderBy('createdAt','desc')),s=>{
  messages=s.docs.map(d=>({id:d.id,...d.data()}));adminUnread=messages.filter(m=>!m.fromAdmin&&!m.readByAdmin).length;
  const newest=messages.find(m=>!m.fromAdmin&&!m.readByAdmin);
  if(newest&&!prevAdminIds.has(newest.id)&&prevAdminIds.size)notifyUser('رسالة جديدة من عميل',newest.text);
  prevAdminIds=new Set(messages.map(m=>m.id));rr('messages');
 }));
 adminUnsubs.push(onSnapshot(collection(db,'reviews'),s=>{adminReviews=s.docs.map(d=>({id:d.id,...d.data()}));rr('reviews')}));
}
